# Pipeline settings. Every choice made in Stage 2 lives here, not in code:
# change a value, re-run the scripts, and git history shows what changed and why.

# D0: what we forecast. "pm25" = hourly PM2.5 in ug/m3 (chosen 2 Oct 2026).
# "pm10" re-runs the whole pipeline for PM10 (planned later; needs its own spike rule).
target = "pm25"

[split]
# Everything from this moment on is the TEST period; the model never trains on it.
# Fixed BEFORE any model, because station selection (below) looks only at training data.
# Confirmed 2 Oct 2026: calendar 2025 (Delhi time) is the test year, one full year incl.
# a winter and Diwali; 2023-2024 is training.
test_start = 2025-01-01T00:00:00+05:30

[hourly]
# D2: an hourly value is the mean of the 15-min readings present; at least this many (1-4).
min_readings = 1
# D1 (sub-decision, confirmed 2 Oct 2026): which hours to average over. Labels become
# true UTC either way.
# "ist" = Delhi clock hours, exactly the hourly values CPCB publishes (10:00-11:00 IST).
# "utc" = whole UTC hours (aligned with weather data, but blends two CPCB hours).
clock = "ist"

[ceiling]
# Analysers stop at 1000 ug/m3. Hours with a reading at the limit get a flag (value kept).
ug_m3 = 1000.0
pollutants = ["pm25", "pm10"]

# D4.1 (d), chosen 2 Oct 2026: a one-hour spike (up more than jump_ug_m3 and straight
# back down) is removed when the city median that hour is below calm_city_median_ug_m3,
# kept when it is at or above polluted_city_median_ug_m3, and in between removed only
# if it is at least min_ratio_in_between x its higher neighbouring hour.
# One table per pollutant; PM10 needs its own evidence before adding [spikes.pm10].
[spikes.pm25]
jump_ug_m3 = 200.0
calm_city_median_ug_m3 = 200.0
polluted_city_median_ug_m3 = 300.0
min_ratio_in_between = 2.0

[flat_runs]
# D4.2 (b): blank a value repeated unchanged for this many hours or more (stuck instrument).
min_hours = 6
# Chosen 2 Oct 2026: hours at the analyser limit are never blanked as frozen; the value
# may be real smog above the limit, and the [ceiling] flag keeps that information.
exempt_hours_at_ceiling = true
pollutants = ["pm25", "pm10"]

[stations]
# D3 (b): keep a station only if it reported the target in at least this % of its
# 15-min slots during TRAINING. Fixed on 2 Oct 2026, before any model was trained.
min_train_coverage_pct = 75.0

[features]
# Stage 3, chosen 2 Oct 2026. A forecast is made at hour t (the end of the latest complete
# hour) for the hour ending t + horizon_hours. Features use only what is known at t.
horizon_hours = 48
# The station's own target value this many hours before t (0 = now: the persistence forecast).
lags_hours = [0, 3, 6, 12, 24, 48, 168]
# Trailing means over the last N hours, blank unless at least this share of hours has a value.
rolling_hours = [6, 24, 72, 168]
rolling_min_share = 0.5
# Other pollutants measured at t (extra accepted 2 Oct 2026).
other_pollutants = ["pm10", "no2", "co"]

[features.diwali]
# Option (a): the target hour starts between 18:00 on Diwali and 12:00 the next day (Delhi).
# 2023-2024 are training, 2025 is the only test event (n = 1), 2026 is for live forecasts.
dates = [2023-11-12, 2024-10-31, 2025-10-20, 2026-11-08]
start_hour_ist = 18
hours = 18

[features.stubble]
# Option (a): the target day (Delhi) falls between these days, inclusive. Kept only to test
# whether it adds anything; stage 5 removes it if it does not (same standard as BLH).
first_day = "10-15"
last_day = "11-15"
