# Render alternative to Railway (railway.json): a free web service built from the Dockerfile.
# Render deploys from a Git repository, so the code must be on GitHub first.
services:
  - type: web
    name: delhi-pm25
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # The GitHub Action commits the live forecast every 6 hours; the site reads that file from
    # GitHub, so those commits need no rebuild.
    buildFilter:
      ignoredPaths:
        - serving/live_forecast.json
