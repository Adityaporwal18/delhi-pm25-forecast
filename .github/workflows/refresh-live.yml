# Refreshes the live forecast about every 3 hours (scripts/14_refresh_live.py) and commits
# serving/live_forecast.json when it changed. The commit history doubles as a log.
# If the refresh keeps the published forecast (fetch failed or the data looked wrong), the run
# fails with the reason in its log and nothing is committed: the site keeps its last good forecast.
# The site reads the committed file from GitHub, so these commits need no Render rebuild
# (render.yaml ignores this file).
# GitHub may start scheduled runs late or drop them, so an outside scheduler (cron-job.org) also
# starts this workflow through GitHub's API (workflow_dispatch) at the same times. Runs queue one
# after another (concurrency below); a run that finds nothing newer changes nothing and succeeds.
name: Refresh live forecast

on:
  schedule:
    # Twice an hour: GitHub starts scheduled runs late or drops them (on 23 Nov 2026 it ran none
    # for 12 hours). Each run first checks, in seconds, whether the published forecast is at least
    # 2 h 45 min old (scripts/16_refresh_due.py) and refreshes only then: forecasts still come about
    # every 3 hours, and a missed or failed refresh is retried half an hour later.
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Is a refresh due? (standard library only, before installing anything)
        id: due
        env:
          PYTHONPATH: src
        run: python3 scripts/16_refresh_due.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the pinned requirements
        if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Refresh the forecast (keeps the last good one if anything looks wrong)
        if: steps.due.outputs.due == 'true'
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python scripts/14_refresh_live.py

      - name: Commit the new forecast
        if: steps.due.outputs.due == 'true'
        run: |
          if git diff --quiet -- serving/live_forecast.json; then
            echo "The forecast file did not change; nothing to commit."
            exit 0
          fi
          summary=$(python -c "import json; d = json.load(open('serving/live_forecast.json')); print(d['issued_utc'], '-', d['stations_reporting'], 'of', d['stations'], 'stations')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serving/live_forecast.json
          git commit -m "Live forecast: issued ${summary}"
          git pull --rebase
          git push
